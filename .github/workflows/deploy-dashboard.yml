name: Deploy dashboard

# Builds apps/dashboard and uploads dist/ to the host. Dispatch-only: a
# dashboard deploy replaces what the office is actively using, so it should be
# a decision, not a side effect of a push.

on:
  workflow_dispatch: {}

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # No version input: package.json pins packageManager: pnpm@10.33.4, and
      # passing a second version makes the action refuse with "Multiple versions
      # of pnpm specified". Let the manifest be the single source.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tamem/dashboard build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet paramiko
      - name: Upload dist/
        env:
          TAMEM_SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
        run: python scripts/deploy-dashboard.py

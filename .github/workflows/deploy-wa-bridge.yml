name: Deploy WhatsApp bridge

# Ships infra/whatsapp/ to the production host and restarts the bridge.
#
# Why a workflow and not just running scripts/deploy-wa-bridge.py locally: the
# SSH password lives here as a repository secret, and the dev machine's copy in
# HANDOFF.md is stale. Actions already holds working credentials (the keepalive
# job uses them every few minutes), so this is the one reliable route to the box.
#
# The heavy lifting stays in scripts/deploy-wa-bridge.py, which uploads to a
# .new file, runs `node --check` with the SERVER's node, backs up the running
# bridge, swaps, waits for status.json to report "connected", and rolls back if
# it doesn't. A syntax error therefore cannot leave the supervisor respawning a
# dead bridge every 3 seconds.

on:
  push:
    branches: [main]
    paths:
      - 'infra/whatsapp/**'
      - '.github/workflows/deploy-wa-bridge.yml'
  workflow_dispatch: {}

concurrency:
  group: whatsapp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # The supervisor, watchdog and keepalive scripts are plain bash and are not
      # touched by the python deploy, so copy them first — the deploy's own
      # recovery path calls keepalive.sh and should be running the current one.
      - name: Upload supervisor + keepalive scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          source: 'infra/whatsapp/keepalive.sh,infra/whatsapp/run-forever.sh,infra/whatsapp/watchdog.sh'
          target: /home/u748721963/whatsapp
          strip_components: 2
          overwrite: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --quiet paramiko

      - name: Deploy bridge (checked, backed up, auto-rollback)
        env:
          TAMEM_SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASS }}
        run: python scripts/deploy-wa-bridge.py

      # Recovery must not depend on GitHub's scheduler. A "*/5" schedule here is
      # best-effort and routinely slips 10-30 minutes under load, and during that
      # hole a reaped SUPERVISOR means nothing sends at all. A server-side cron
      # closes it to one minute. keepalive.sh is flock-guarded and idempotent, so
      # running it every minute is safe and overlapping fires are no-ops.
      - name: Install per-minute server cron for keepalive
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          script: |
            chmod +x /home/u748721963/whatsapp/keepalive.sh /home/u748721963/whatsapp/run-forever.sh /home/u748721963/whatsapp/watchdog.sh
            LINE='* * * * * /bin/bash /home/u748721963/whatsapp/keepalive.sh >/dev/null 2>&1'
            if ! command -v crontab >/dev/null 2>&1; then
              # Verified on this host: shared hosting ships no crontab CLI, so a
              # cron can only be added through hPanel. Not fatal — watchdog.sh
              # and run-forever.sh resurrect each other without any cron. The
              # hPanel entry is still worth adding: it is the only layer that
              # survives everything being reaped at once.
              # These echoes land in the Actions log, not a step summary: this
              # script runs on the HOST over SSH, where $GITHUB_STEP_SUMMARY
              # does not exist.
              echo "::warning::No crontab CLI on this host — add this in hPanel > Advanced > Cron Jobs:"
              echo "::warning::$LINE"
              # Make sure the pair is actually up right now.
              bash /home/u748721963/whatsapp/keepalive.sh || true
              pgrep -af 'watchdog.sh|run-forever.sh' || echo "(nothing running yet)"
              exit 0
            fi
            crontab -l 2>/dev/null > /tmp/ct.now || true
            if ! grep -Fq 'whatsapp/keepalive.sh' /tmp/ct.now; then
              cp /tmp/ct.now /tmp/ct.next
              echo "$LINE" >> /tmp/ct.next
              crontab /tmp/ct.next && echo "cron entry installed"
            fi
            echo "--- crontab now ---"
            crontab -l 2>/dev/null || echo "(crontab -l failed)"
            # Assert, do not assume. A deploy that leaves no recovery layer is
            # broken: that is precisely the state that caused hours-long
            # outages, because GitHub's '*/5' schedule actually fires about
            # every 5 HOURS (measured: median 291 min over 39 runs), so a
            # reaped supervisor went unnoticed until the next lucky fire.
            crontab -l 2>/dev/null | grep -Fq 'whatsapp/keepalive.sh' || {
              echo "::error::cron entry is NOT in the crontab after install"
              exit 1
            }
            echo "verified: per-minute keepalive cron is in the crontab"

      - name: Report bridge state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          script: |
            WA=/home/u748721963/domains/deliverytamem.com/public_html/backendtamem/uploads/.wa
            echo "--- status.json ---"; cat "$WA/status.json" 2>/dev/null | head -c 600; echo
            # Counts and reasons only. This log is public: no phone numbers, no
            # message text. `ls | wc -l` counted every entry including markers,
            # which read as a 79-message backlog when the real queue was empty.
            echo "--- queue breakdown ---"
            for d in queue dead control; do
              j=$(ls -1A "$WA/$d"/*.json 2>/dev/null | wc -l)
              g=$(ls -1A "$WA/$d"/*.sending 2>/dev/null | wc -l)
              k=$(find "$WA/$d" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
              a=$(ls -1A "$WA/$d" 2>/dev/null | wc -l)
              echo "$d: $a entries ($j .json, $g .sending, $k dirs)"
            done
            echo "--- why messages were parked (reasons only) ---"
            grep -ho '"reason":"[^"]*"' "$WA"/dead/*.json 2>/dev/null | sort | uniq -c | sort -rn | head
            echo "--- oldest parked ---"
            ls -1t "$WA"/dead/*.json 2>/dev/null | tail -3 | xargs -r stat -c '%y %n' 2>/dev/null | sed 's#.*/#... #'
            echo "--- processes (all three layers should be here) ---"
            pgrep -af 'watchdog.sh|run-forever.sh|wa-bridge.js' | grep -v 'bash -c' || echo "(none)"
            echo "--- last log (bridge/supervisor/watchdog lines only) ---"
            grep -hE '^\[(bridge|supervisor|watchdog|keepalive) ' /home/u748721963/whatsapp/bridge.log 2>/dev/null | tail -n 20
